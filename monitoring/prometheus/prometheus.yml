# ==============================================================================
# Enterprise MLOps Platform - Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: "production-local"
    platform: "enterprise-mlops-platform"

# Rule files specifying alert evaluation rules
rule_files:
  - "alerts.yml"

# Scrape configurations targeting platform components
scrape_configs:
  # 1. FastAPI Model Serving Engine
  - job_name: "fastapi-serving"
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: "fastapi"
          tier: "serving"

  # 2. Prometheus Self-Monitoring
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
          tier: "monitoring"
